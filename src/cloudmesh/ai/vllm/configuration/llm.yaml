cloudmesh:
  ai:
    server:
      uva:
        gemma-4-31b:
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_gemma4.sif"
          model: "google/gemma-4-31B-it"
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        gemma-4-9b:
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          cpus: 2
          gpus: 1
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "32G"
          image: "/scratch/thf2bn/vllm_gemma9.sif"
          model: "google/gemma-4-9B-it"
          gpu_memory_utilization: 0.90
          max_model_len: 16384
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        gemma-4:
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_gemma4.sif"
          model: "google/gemma-4-31B-it"
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        coder-qwen:
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_qwen_coder.sif"
          model: "Qwen/Qwen2.5-Coder-70B-Instruct"
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        plan-mode:
          max_model_len: 32768
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_deepseek_r1.sif"
          model: "deepseek-ai/DeepSeek-R1"
          extra_args: |
            --tensor-parallel-size {tensor_parallel_size}
            --gpu-memory-utilization 0.90
            --max-model-len 32768
            --max-num-batched-tokens {max_model_len}
            --enforce-eager
            --trust-remote-code
            --enable-chunked-prefill
            --host 0.0.0.0
          cache_dir: "/scratch/$USER/hf_cache"
          key_dir: "$HOME/gemma"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        gemma2:
          max_model_len: 131072
          name: "vllm_gemma_{remote_port}"
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 2
          gpus: 2
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "96G"
          image: "/scratch/thf2bn/vllm_gemma4.sif"
          model: "google/gemma-4-31B-it"
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          local_port: 18123
          remote_port: 18123
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N
          shell: /bin/bash
          script: |
            export HF_TOKEN=$(cat $HOME/.config/cloudmesh/llm/HF_token.txt)
            export VLLM_API_KEY=$(cat $HOME/.config/cloudmesh/llm/server_master_key.txt)
            cd /scratch/{user}
            module load apptainer
            apptainer run --nv \
              -B {cache_dir}:/root/.cache/huggingface \
              --env HF_TOKEN="${HF_TOKEN}" \
              --env VLLM_API_KEY="${VLLM_API_KEY}" \
              {image} \
              --model {model} \
              --tensor-parallel-size {tensor_parallel_size} \
              --gpu-memory-utilization 0.85 \
                --max-model-len {max_model_len} \
               --enable-prefix-caching \
              --load-format safetensors \
              --host 0.0.0.0 \
              --port {remote_port}

        gemma:
          max_model_len: 131072
          time: "04:00:00"
          name: "vllm_gemma_{remote_port}"
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_gemma4.sif"
          model: "google/gemma-4-31B-it"
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          local_port: 18123
          remote_port: 18123
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N
          shell: /bin/bash
          script: |
            export HF_TOKEN=$(cat $HOME/.config/cloudmesh/llm/HF_token.txt)
            export VLLM_API_KEY=$(cat $HOME/.config/cloudmesh/llm/server_master_key.txt)
            cd /scratch/{user}
            module load apptainer
            apptainer run --nv \
              -B {cache_dir}:/root/.cache/huggingface \
              --env HF_TOKEN="${HF_TOKEN}" \
              --env VLLM_API_KEY="${VLLM_API_KEY}" \
              {image} \
              --model {model} \
              --tensor-parallel-size {tensor_parallel_size} \
              --gpu-memory-utilization 0.85 \
               --max-model-len {max_model_len} \
               --enable-prefix-caching \
              --load-format safetensors \
              --enable-auto-tool-choice \
              --tool-call-parser gemma4 \
              --host 0.0.0.0 \
              --port {remote_port}
        qwen:
          name: "vllm_qwen_{remote_port}"
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_qwen_coder.sif"
          model: "Qwen/Qwen2.5-Coder-70B-Instruct"
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          local_port: 18125
          remote_port: 18125
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        deepseek:
          max_model_len: 32768
          name: "vllm_deepseek_{remote_port}"
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 4
          gpus: 4
          gres: "gpu:a100:{gpus}"
          tensor_parallel_size: "{gpus}"
          mem: "64G"
          image: "/scratch/thf2bn/vllm_deepseek_r1.sif"
          model: "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"
          extra_args: |
            --tensor-parallel-size {tensor_parallel_size}
            --gpu-memory-utilization 0.90
            --max-model-len 32768
            --max-num-batched-tokens {max_model_len}
            --enforce-eager
            --trust-remote-code
            --enable-chunked-prefill
            --host 0.0.0.0
          cache_dir: "/scratch/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/gemma"
          host: "uva"
          local_port: 18126
          remote_port: 18126
          user: '{~/.ssh/config:uva.user}'
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N

        mock:
          image: "/scratch/{user}/mock/mock.sif"
          launch_mode: "sbatch"
          account: "bii_dsc_community"
          partition: "bii-gpu"
          reservation: "bi_fox_dgx"
          cpus: 2
          gpus: 1
          mem: "32G"
          host: "uva"
          user: '{~/.ssh/config:uva.user}'
          remote_dir: "/scratch/{user}/cloudmesh/mock"
          copy:
            src: "cloudmesh-ai-llm/src/cloudmesh/ai/mock/mock_server.py"
            dst: "{remote_dir}/mock_server.py"
          tunnel: |
            lsof -ti:{local_port} | xargs kill -9
            ssh -L {local_port}:udc-an26-1:{remote_port} uva -N
          submit_script: |
            #!/bin/bash
            #SBATCH --job-name=vllm_mock_{remote_port}
            #SBATCH --partition={partition}
            #SBATCH --reservation={reservation}
            #SBATCH --account={account}
            #SBATCH --gres=gpu:a100:{gpus}
            #SBATCH --cpus-per-task={cpus}
            #SBATCH --mem={mem}
            #SBATCH --time=03:00:00
            #SBATCH --output={remote_dir}/vllm_mock_{remote_port}.out
            #SBATCH --error={remote_dir}/vllm_mock_{remote_port}.err
            
            cd {remote_dir}
            ls -la
            bash start_uva.sh
          script: |
            module load apptainer
            apptainer run --nv \
              -B {remote_dir}:/app \
              -W /app \
              {image} \
              --port {remote_port}
      dgx:
        local-gemma-2:
          gpus: 2
          launch_mode: "local"
          image: "vllm/vllm-openai:gemma4-cu130"
          model: "google/gemma-4-31B-it"
          tensor_parallel_size: 2
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/home/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/.config/cloudmesh/ai/keys"
          host: "dgx"
          script: |
            HF_TOKEN=$(cat ../server_master_key.txt) 
            VLLM_API_KEY=$(cat ../server_master_key.txt)

            # Optimized Docker Run
            docker run --gpus '"device=0,1"' \
              --shm-size 16gb \
              -v {cache_dir}:/root/.cache/huggingface \
              -p 127.0.0.1:8000:8000 \
              -e HF_TOKEN="${HF_TOKEN}" \
              -e VLLM_API_KEY="${VLLM_API_KEY}" \
              vllm/vllm-openai:gemma4-cu130 \
              --model google/gemma-4-31B-it \
              --tensor-parallel-size {tensor_parallel_size} \
              --gpu-memory-utilization 0.90 \
              --max-model-len 65536 \
              --enable-prefix-caching \
              --load-format safetensors

        local-gemma-4:
          gpus: 4
          launch_mode: "local"
          image: "vllm/vllm-openai:gemma4-cu130"
          model: "google/gemma-4-31B-it"
          tensor_parallel_size: 4
          gpu_memory_utilization: 0.90
          max_model_len: 32768
          cache_dir: "/home/{user}/hf_cache_{remote_port}"
          key_dir: "$HOME/.config/cloudmesh/ai/keys"
          host: "dgx"
          script: |
            HF_TOKEN=$(cat ../server_master_key.txt) 
            VLLM_API_KEY=$(cat ../server_master_key.txt)

            # Optimized Docker Run
            docker run --gpus '"device=0,1"' \
              --shm-size 16gb \
              -v {cache_dir}:/root/.cache/huggingface \
              -p 127.0.0.1:8000:8000 \
              -e HF_TOKEN="${HF_TOKEN}" \
              -e VLLM_API_KEY="${VLLM_API_KEY}" \
              vllm/vllm-openai:gemma4-cu130 \
              --model google/gemma-4-31B-it \
              --tensor-parallel-size {tensor_parallel_size} \
              --gpu-memory-utilization 0.90 \
              --max-model-len 65536 \
              --enable-prefix-caching \
              --load-format safetensors

        local-gemma:
          gpus: 4
          launch_mode: "local"
          image: "vllm/vllm-openai:gemma4-cu130"
          model: "google/gemma-4-31B-it"
          tensor_parallel_size: 4
          gpu_memory_utilization: 0.95
          max_model_len: 131072
          cache_dir: "/home/{user}/hf_cache_{remote_port}"
          host: "localhost"
          port: 8000
          gpu_ids: "0,1,2,3"
          script: |
            # Docker run for local Gemma model
            # HF_TOKEN and VLLM_API_KEY loaded from ~/.config/cloudmesh/.env
            docker run -d --name vllm-local-gemma --gpus all \
              --shm-size 16gb \
              -v {cache_dir}:/root/.cache/huggingface \
              -p 127.0.0.1:{port}:8000 \
              -e HF_TOKEN="{HF_TOKEN}" \
              -e VLLM_API_KEY="{VLLM_API_KEY}" \
              -e NVIDIA_VISIBLE_DEVICES={gpu_ids} \
              {image} \
              --model {model} \
              --tensor-parallel-size {tensor_parallel_size} \
              --gpu-memory-utilization {gpu_memory_utilization} \
              --max-model-len {max_model_len} \
              --enable-prefix-caching \
              --load-format safetensors \
              --enable-auto-tool-choice \
              --tool-call-parser gemma4

    client:
      aider:
        OPENAI_API_BASE: http://localhost:8001/v1
        OPENAI_API_KEY: '{SERVER_MASTER_KEY}'
        launcher: aider
        model: openai/google/gemma-4-31B-it
      claude:
        ANTHROPIC_AUTH_TOKEN: '{SERVER_MASTER_KEY}'
        ANTHROPIC_DEFAULT_HAIKU_MODEL: google/gemma-4-31B-it
        ANTHROPIC_DEFAULT_SONNET_MODEL: google/gemma-4-31B-it
        ANTHROPIC_MODEL: google/gemma-4-31B-it
        CLAUDE_CODE_ATTRIBUTION_HEADER: 0
        CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: 1
        OPENAI_API_BASE: http://localhost:8001/v1
        OPENAI_API_KEY: '{SERVER_MASTER_KEY}'
        launcher: claude
      openwebui:
        OPENAI_API_BASE: http://localhost:8001/v1
        OPENAI_API_KEY: '{SERVER_MASTER_KEY}'
        host: localhost
        launcher: webui
        port: 3000