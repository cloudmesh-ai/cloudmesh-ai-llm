# LiteLLM Configuration
# Supports both local vLLM models and UVA Kimi K2.5 remote access
# Requires: SSH tunnel active (port 8080) OR proxy_shim running (port 8081) for UVA endpoints

model_list:
  # ==========================================
  # Local vLLM Models (Host: white - Port 18000)
  # ==========================================
  - model_name: gemma-4-it-white
    litellm_params:
      model: openai/google/gemma-4-e4b-it
      api_base: http://white:18000/v1
      api_key: dummy-key
  
  - model_name: qwen-2.5-coder-32b-white
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct-AWQ
      api_base: http://white:18000/v1
      api_key: dummy-key

  - model_name: qwen-2.5-32b-white
    litellm_params:
      model: openai/Qwen/Qwen2.5-32B-Instruct-AWQ
      api_base: http://white:18000/v1
      api_key: dummy-key

  - model_name: gemma-2-27b-white
    litellm_params:
      model: openai/google/gemma-2-27b-it
      api_base: http://white:18000/v1
      api_key: dummy-key

  # ==========================================
  # Local vLLM Models (Host: spark - Port 18001)
  # ==========================================
  - model_name: deepseek-r1-70b-spark
    litellm_params:
      model: openai/casperhansen/deepseek-r1-distill-llama-70b-awq
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: qwen-3.6-moe-a3b-instruct-spark
    litellm_params:
      model: openai/Qwen/Qwen3.6-35B-A3B-Instruct
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: qwen-3.6-moe-a3b-spark
    litellm_params:
      model: openai/Qwen/Qwen3.6-35B-A3B
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: gemma-4-it-spark
    litellm_params:
      model: openai/google/gemma-4-it
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: qwen3-coder-32b-spark
    litellm_params:
      model: openai/Qwen/Qwen3-Coder-32B-Instruct
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: llama-3-70b-fp4-spark
    litellm_params:
      model: openai/unsloth/Llama-3-70B-Instruct-quantized-FP4
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: llama-3-70b-fp8-spark
    litellm_params:
      model: openai/neuralmagic/Meta-Llama-3-70B-FP8
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: gemma-2-27b-spark
    litellm_params:
      model: openai/google/gemma-2-27b-it
      api_base: http://spark:18001/v1
      api_key: dummy-key

  - model_name: llama-3-8b-spark
    litellm_params:
      model: openai/meta-llama/Meta-Llama-3-8B-Instruct
      api_base: http://spark:18001/v1
      api_key: dummy-key

  # ==========================================
  # UVA Kimi K2.5 - Integration Options
  # ==========================================
  
  # Option 1: Direct via SSH tunnel
  # Requires: SSH tunnel active: ssh -L 8080:open-webui.rc.virginia.edu:443 uva
  # Note: Relies on localhost to reach host from container
  - model_name: Kimi K2.5
    litellm_params:
      model: "openai/Kimi K2.5"
      api_base: http://localhost:8080/api
      api_key: os.environ/UVA_KIMI_KEY
      extra_headers: '{"Host": "open-webui.rc.virginia.edu"}'
      ssl_verify: false
  
  # Option 2: Via proxy_shim.py
  # Requires: python proxy_shim.py running on port 8081
  # More robust - handles header injection and payload cleaning
  - model_name: kimi-2.5-proxy
    litellm_params:
      model: "Kimi K2.5"
      api_base: http://localhost:8081/v1
      api_key: dummy-key

# ==========================================
# Environment Variables
# ==========================================
# Set UVA Kimi key before starting LiteLLM:
#   export UVA_KIMI_KEY=$(cat ~/gemma/uva-kimmi-key.txt)
#
# Or add to start2.py's environment loading