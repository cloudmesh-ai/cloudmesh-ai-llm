[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmctl"
version = "1.0.0"
description = "Cloudmesh AI LLM - Unified CLI for managing LLM infrastructure"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Cloudmesh AI Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "requests>=2.28.0",
    "flask>=2.0.0",
    "urllib3>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=1.0",
]

[project.scripts]
llmctl = "llmctl.main:main"

[project.urls]
Homepage = "https://github.com/cloudmesh-ai/cloudmesh-ai-llm"
Documentation = "https://github.com/cloudmesh-ai/cloudmesh-ai-llm#readme"
Repository = "https://github.com/cloudmesh-ai/cloudmesh-ai-llm"

[tool.setuptools]
packages = ["llmctl", "llmctl.commands"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true