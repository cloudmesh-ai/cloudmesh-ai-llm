docs_dir: docs
extra_css:
- css/custom.css
nav:
- Home: index.md
- User Manual:
  - Installation: user-manual/installation.md
  - Starting AI Services: user-manual/starting-services.md
  - Monitoring Services: user-manual/monitoring.md
  - Troubleshouting: user-manual/troubleshooting.md
- Proxy Service:
  - Introduction: proxy-service/introduction.md
- Client Tooling:
  - Overview: client-tools/overview.md
- Developers Manual:
  - Python Samples: api-samples/python-examples.md
  - Mock Service: developers-manual/mock-vllm-service.md 
  - Project:
    - Changelog: CHANGELOG.md
    - GitHub: https://github.com/cloudmesh-ai/cloudmesh-ai-llm
    - Issues: https://github.com/cloudmesh-ai/cloudmesh-ai-llm/issues
plugins:
- cloudmesh-ai-theme
- search
- mkdocstrings:
    handlers:
      python:
        options:
          docstring_section_style: table
          docstring_style: google
          group_by_category: true
          members: true
          separate_signature: true
          show_category_heading: true
          show_root_full_path: true
          show_source: true
          show_submodules: true
        paths:
        - src
site_name: Cloudmesh AI Llm
theme:
  name: material
  features:
    # - content.code.annotate # Optional
    # Add this to hide the language labels
    - content.code.copy

use_directory_urls: false

markdown_extensions:
  - admonition
  - pymdownx.tabbed:
      alternate_style: true